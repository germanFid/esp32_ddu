[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

;lib_ldf_mode = deep+

lib_deps =
    lovyan03/LovyanGFX @ ^1.2.34
    lvgl/lvgl

build_flags =
    -Os
    -I include
    -I${PROJECT_DIR}/certificates
    -I .pio/libdeps/esp32dev/LovyanGFX/src
    -D LV_USE_LOVYAN_GFX=1
    -D LV_LGFX_USER_INCLUDE='"my_display.hpp"'
    -D LV_CONF_SKIP
    -D LV_COLOR_FORMAT_DEFAULT=LV_COLOR_FORMAT_RGB565
    -D LV_USE_LOG=1
    -D LV_FONT_FMT_TXT_LARGE=1
;    -D ST7796_DRIVER=1
;    -D TFT_WIDTH=320                              ; Set TFT size
;    -D TFT_HEIGHT=480
;    -D TFT_MISO=19                                ; Define SPI pins
;    -D TFT_MOSI=23
;    -D TFT_SCLK=18
;    -D TFT_CS=15
;    -D TFT_DC=2                                  ; Data/Comand pin
;    -D TFT_RST=4                                 ; Reset pin
;    -D LOAD_GLCD=1                                ; Load Fonts
;    -D SPI_FREQUENCY=40000000                     ; Set SPI frequency
;    -D USER_SETUP_LOADED=1
; -include $PROJECT_LIBDEPS_DIR/$PIOENV/TFT_eSPI/User_Setups/Setup1_ILI9341.h
